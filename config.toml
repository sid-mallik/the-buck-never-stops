baseURL = "https://sid-mallik.github.io/the-buck-never-stops/"
relativeURLs = true
canonifyURLs = false
languageCode = "en-us"
theme = "hugo-winston-theme"
themesDir = "themes"
# title = "Hugo Winston Theme"
title = "Moral Values of Decisions for Providing Macro-security"
paginate = 3
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  google_analytics_id = ""
  twitter_handle = ""
  showAuthorOnHomepage = true
  showAuthorOnPosts = false
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  usePaginationOnHomepage = false
  limitPostsOnHomepage = 3 # only used if usePaginationOnHomepage is false
  sortPostsByDateOldestFirst = false
  addDot = true
  addFrame = true
  highlightColor = '#7b16ff'
  baseColor = "#121212"
  baseOffsetColor = "#1e1e1e"
  headingColor = "#D3D3D3"
  textColor = "#C0C0C0"
  dotColor = "#7b16ff"
  enableGoogleFonts = true 
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
  fontFamilyHeading = "Source Sans Pro" # "Poppins"
  fontFamilyParagraph = "Source Serif 4" # "Helvetica"
  fontFamilyMonospace = "monospace" # "monospace"

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

